# exp_38 GPU confirmation of the restored ratchet. STAMPS OFF on every line
# (timestamps=1 costs ~15 us and the headline number must not carry it).
#
# Two arms, alternated so session drift cannot masquerade as the throttle
# effect. g=353 is the ratchet (throttle ENABLE + depth 4 + skip-part-zero);
# g=65 is the same config with the throttle DISABLED. The contrast g=353 - g=65
# IS the exp_24 injection bound, and it is the mechanistic check: it read
# -613.5 us at rev 26 and only -1.8 us at the mode-14 pin.
# round 1
C=16,g=353,mode=12,flush_rows=16
C=16,g=65,mode=12,flush_rows=16
# round 2
C=16,g=65,mode=12,flush_rows=16
C=16,g=353,mode=12,flush_rows=16
# round 3
C=16,g=353,mode=12,flush_rows=16
C=16,g=65,mode=12,flush_rows=16
